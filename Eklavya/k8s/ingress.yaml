apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eklavya-ingress
  namespace: eklavya
  annotations:
    kubernetes.io/ingress.class: azure-application-gateway
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60s"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60s"
spec:
  ingressClassName: azure-application-gateway
  tls:
    - hosts:
        - eklavyaart.com
        - www.eklavyaart.com
      secretName: eklavya-tls
  rules:
    - host: eklavyaart.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
    - host: www.eklavyaart.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
</write_to_file>
</execute_command>
<write_to_file>
<path>Eklavya/k8s/deploy.sh</path>
<content>
#!/bin/bash
# Deployment script for Eklavya Art School on Azure AKS
# Usage: ./deploy.sh <acr-name> <image-tag>

set -e

ACR_NAME=${1:-eklavyacr}
IMAGE_TAG=${2:-latest}
NAMESPACE="eklavya"

echo "=== Eklavya Art School - Azure AKS Deployment ==="
echo "ACR: $ACR_NAME"
echo "Image Tag: $IMAGE_TAG"
echo "Namespace: $NAMESPACE"
echo ""

# Create namespace
echo "[1/6] Creating namespace..."
kubectl apply -f k8s/namespace.yaml

# Create secrets (edit secrets.yaml with your values first)
echo "[2/6] Applying secrets..."
kubectl apply -f k8s/secrets.yaml -n $NAMESPACE

# Build and push backend image
echo "[3/6] Building and pushing backend image..."
docker build -t $ACR_NAME.azurecr.io/eklavya-backend:$IMAGE_TAG ./backend
docker push $ACR_NAME.azurecr.io/eklavya-backend:$IMAGE_TAG

# Build and push frontend image
echo "[4/6] Building and pushing frontend image..."
docker build -t $ACR_NAME.azurecr.io/eklavya-frontend:$IMAGE_TAG ./frontend
docker push $ACR_NAME.azurecr.io/eklavya-frontend:$IMAGE_TAG

# Update image tags in deployment manifests
echo "[5/6] Updating image references..."
sed -i "s|eklavya-backend:latest|$ACR_NAME.azurecr.io/eklavya-backend:$IMAGE_TAG|g" k8s/backend-deployment.yaml
sed -i "s|eklavya-frontend:latest|$ACR_NAME.azurecr.io/eklavya-frontend:$IMAGE_TAG|g" k8s/frontend-deployment.yaml

# Apply deployments and services
echo "[6/6] Applying deployments and services..."
kubectl apply -f k8s/backend-deployment.yaml -n $NAMESPACE
kubectl apply -f k8s/frontend-deployment.yaml -n $NAMESPACE

# Apply ingress (optional - uncomment if using ingress)
# kubectl apply -f k8s/ingress.yaml -n $NAMESPACE

echo ""
echo "=== Deployment complete! ==="
echo ""
echo "To check status:"
echo "  kubectl get pods -n $NAMESPACE"
echo "  kubectl get services -n $NAMESPACE"
echo ""
echo "To port-forward for local testing:"
echo "  kubectl port-forward service/backend 8000:8000 -n $NAMESPACE"
echo "  kubectl port-forward service/frontend 3000:3000 -n $NAMESPACE"
</write_to_file>
</execute_command>
