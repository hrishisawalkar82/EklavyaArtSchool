apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eklavya-ingress
  namespace: eklavya
  annotations:
    kubernetes.io/ingress.class: azure-application-gateway
spec:
  ingressClassName: azure-application-gateway
  tls:
    - hosts:
        - eklavyaart.com
        - www.eklavyaart.com
      secretName: eklavya-tls
  rules:
    - host: eklavyaart.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
    - host: www.eklavyaart.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000