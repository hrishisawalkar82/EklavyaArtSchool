apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: eklavya
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: eklavya-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: eklavya-secrets
                  key: database-url
            - name: AZURE_STORAGE_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: eklavya-secrets
                  key: azure-storage-connection-string
            - name: AZURE_CONTAINER_GALLERY
              value: "gallery"
            - name: AZURE_CONTAINER_KIDS
              value: "kids"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: eklavya-secrets
                  key: jwt-secret
            - name: ADMIN_EMAIL
              value: "admin@eklavyaart.com"
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eklavya-secrets
                  key: admin-password
            - name: ADMIN_NAME
              value: "School Admin"
            - name: ADMIN_NOTIFICATION_EMAIL
              value: "admin@eklavyaart.com"
            - name: AZURE_COMMUNICATION_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: eklavya-secrets
                  key: azure-communication-connection-string
            - name: AZURE_COMMUNICATION_SENDER
              valueFrom:
                secretKeyRef:
                  name: eklavya-secrets
                  key: azure-communication-sender
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: eklavya-secrets
                  key: smtp-host
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: eklavya-secrets
                  key: smtp-user
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eklavya-secrets
                  key: smtp-password
            - name: SMTP_FROM
              valueFrom:
                secretKeyRef:
                  name: eklavya-secrets
                  key: smtp-from
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: eklavya
  labels:
    app: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
      name: http
</write_to_file>
</execute_command>
